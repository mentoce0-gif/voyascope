name: validate-cards

on:
  push:
    paths: ["curation/**", "schema/**", "scripts/**", "config/**", "examples/**", "web/**", "tests/**", "prompts/**", "RULES.md"]
  pull_request:
    paths: ["curation/**", "schema/**", "scripts/**", "config/**", "examples/**", "web/**", "tests/**", "prompts/**", "RULES.md"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: web/data/ のコピーが最新か
        run: node scripts/sync-web-data.mjs --check
      - name: AI 依頼文が最新か
        run: node scripts/build-prompts.mjs --check
      - name: 読み込み量が上限の中か（スマホで重くしない）
        run: node scripts/check-size.mjs
