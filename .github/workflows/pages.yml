name: pages

# GitHub Pages には「voyascope.org に移りました」の案内だけを置く（2026-10-15、M9 ②）。
# 本番は https://voyascope.org（Cloudflare。deploy.yml）。
# pages-moved/ の index.html と 404.html（どの道で来ても、同じ道の voyascope.org へ3秒で移る）。
# - pages-moved/ かこのファイルを変えたとき
# - 手動（Actions の画面から）

on:
  push:
    branches: [main]
    paths: ["pages-moved/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-moved
      - id: deployment
        uses: actions/deploy-pages@v4
