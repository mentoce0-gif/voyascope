name: pages

# web/ を GitHub Pages に公開する。
# - main に web/ の変更が入ったとき
# - 軌道データ・運用状況・打ち上げ予定の自動更新（update-orbits）と、探査機の距離の自動更新（update-horizons）が終わったとき
#   （Actions がコミットしたプッシュでは、ほかのワークフローが動かないため）
# - 手動（Actions の画面から）
#
# 2026-09-30 オーナー方針：微修正を重ねたあと Cloudflare Pages に移す。それまでの仮の公開先。
# 移したら、このワークフローは消すか手動だけにする。

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [update-orbits, update-horizons]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 自動更新が「失敗」で終わっても公開し直す。失敗は、軌道データをコミットしたあとで
    # 運用状況・打ち上げ予定の取得の失敗を知らせるためのことがあり、公開を止めると軌道データまで古くなるため
    # （何もコミットされていなければ、同じ中身を公開し直すだけ）
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
