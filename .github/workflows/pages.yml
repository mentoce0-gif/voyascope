name: pages

# web/ を GitHub Pages に公開する（手動のときだけ）。
#
# 2026-09-30 オーナー方針：微修正を重ねたあと Cloudflare Pages に移す。
# それまでは GitHub Pages を有効にしていないので、自動では動かさない
# （有効にしないまま自動で動くと、6時間ごとの自動更新のたびに失敗の通知が届くため）。
# GitHub Pages で公開する場合は、Settings → Pages → Source を「GitHub Actions」にしてから、
# 下の push と workflow_run を戻す：
#   push: { branches: [main], paths: ["web/**", ".github/workflows/pages.yml"] }
#   workflow_run: { workflows: [update-orbits], types: [completed] }

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 自動更新が失敗したときは公開し直さない
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
