<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">

  .cap { position: absolute; left: 22px; right: 22px; bottom: 54px; transition: none; }

<body>
<div class="warp-vignette" id="vig"></div>
<div class="hud">
  <div class="brand">VOYASCOPE</div>

  <div class="cap"><div class="k" id="capk"></div><div class="t" id="capt"></div></div>
  <div class="note">模式図：地球と火星の位置は計算。到着日は仮（打ち上げ330日後）。火星のまわりは簡略化。大きさは実際の比ではありません</div>
  <div class="tag" id="tag-tane">種子島</div>

</div>
<script type="module">
import * as THREE from "../../web/vendor/three-r128.min.js";
import { makeKit, MODELS } from "../../web/js/far/models.js";

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050e1f);
const camera = new THREE.PerspectiveCamera(42, W / H, 0.01, 500);

const MINT = new THREE.Color(0x5ef2c2), AMBER = new THREE.Color(0xffb547);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- 星 ----------
{
  const n = 2200, p = new Float32Array(n * 3), s = new Float32Array(n);
  let seed = 7; const rnd = () => ((seed = (1664525 * seed + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < n; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = 160;
    p.set([r * Math.sqrt(1 - u * u) * Math.cos(th), r * u, r * Math.sqrt(1 - u * u) * Math.sin(th)], i * 3);
    s[i] = 0.4 + rnd() * 1.4;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  g.setAttribute("aSize", new THREE.BufferAttribute(s, 1));
  scene.add(new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    vertexShader: `attribute float aSize; void main(){ gl_PointSize = aSize * 2.0; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `void main(){ float d = length(gl_PointCoord-.5); gl_FragColor = vec4(vec3(.8,.9,1.), smoothstep(.5,.0,d)*.7); }`,
  })));
}

// ワープの星の筋（遠くを見る部屋と同じ考え方：速いほど星が後ろへ流れる）
const streak = (() => {
  const n = 900, p = [], e = [];
  let seed = 21; const rnd = () => ((seed = (1664525 * seed + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < n; i++) { const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = 30 + rnd() * 60; const q = [r * Math.sqrt(1 - u * u) * Math.cos(th), r * u, r * Math.sqrt(1 - u * u) * Math.sin(th)]; p.push(...q, ...q); e.push(0, 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3)); g.setAttribute("aEnd", new THREE.Float32BufferAttribute(e, 1));
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uDir: { value: V(0, 0, 1) }, uLen: { value: 0 }, uA: { value: 0 }, uC: { value: V(0, 0, 0) } },
    vertexShader: `attribute float aEnd; uniform vec3 uDir, uC; uniform float uLen; varying float vE; void main(){ vE = aEnd; vec3 p = position + uC + uDir * uLen * aEnd; gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.); }`,
    fragmentShader: `uniform float uA; varying float vE; void main(){ gl_FragColor = vec4(.85,.93,1., uA * (1. - vE)); }` });
  scene.add(new THREE.LineSegments(g, m)); return m;
})();

// ---------- 太陽系（模式。大きさ・距離は実際の比ではない） ----------
// 打ち上げ日の地球と、約1年弱後（仮に330日後）の火星の位置（astronomy-engine）と、その2点を結ぶ軌道（ランベルトの解）。
// 計算は scratchpad の route.mjs。1 AU = 10。黄道面を水平に
const RT = await (await fetch("route.json")).json();
const AU = 10, P = (v) => V(v[0] * AU, v[2] * AU, -v[1] * AU);
const earthPos = P(RT.earth), marsPos = P(RT.mars);

// 太陽
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.9, 48, 32), new THREE.MeshStandardMaterial({ color: 0xffe2a8, emissive: 0xffc96b, emissiveIntensity: 2.2 }));
scene.add(sun);
const billboards = [];
const board = (frag, color, size, pos) => {
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uC: { value: new THREE.Color(color) }, uS: { value: size }, uA: { value: 1 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: frag });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), m); mesh.position.copy(pos); scene.add(mesh); billboards.push(mesh);
  return m;
};
const glow = (color, size, pos) => board(`uniform vec3 uC; uniform float uA; varying vec2 vUv; void main(){ float d=length(vUv-.5)*2.; gl_FragColor=vec4(uC, pow(max(0.,1.-d),2.4)*uA); }`, color, size, pos);
const ringGlow = (color, pos) => board(`uniform vec3 uC; uniform float uA; varying vec2 vUv; void main(){ float d=length(vUv-.5)*2.; gl_FragColor=vec4(uC, smoothstep(.72,.88,d)*smoothstep(1.,.9,d)*uA); }`, color, 0.2, pos);
glow(0xffb547, 9, V(0, 0, 0)); glow(0xfff3d6, 3.2, V(0, 0, 0));

// 公転の線
const ring = (r, color, a) => {
  const n = 256, p = [];
  for (let i = 0; i < n; i++) { const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2; p.push(...onOrbit(r, a0).toArray(), ...onOrbit(r, a1).toArray()); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uC: { value: new THREE.Color(color) }, uA: { value: a } },
    vertexShader: `void main(){ gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uC; uniform float uA; void main(){ gl_FragColor = vec4(uC,uA); }` });
  scene.add(new THREE.LineSegments(g, m));
};
const orbitLine = (pts, color, a) => {
  const p = []; for (let i = 0; i < pts.length - 1; i++) p.push(...P(pts[i]).toArray(), ...P(pts[i + 1]).toArray());
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.LineSegments(g, new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uC: { value: new THREE.Color(color) }, uA: { value: a } },
    vertexShader: `void main(){ gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uC; uniform float uA; void main(){ gl_FragColor = vec4(uC,uA); }` })));
};
orbitLine(RT.earthOrbit, 0x5b8fd6, 0.3);
orbitLine(RT.marsOrbit, 0xd98a5b, 0.3);

// 光
scene.add(new THREE.AmbientLight(0x6d86b8, 0.28));
const sunLight = new THREE.DirectionalLight(0xfff1dc, 2.6); sunLight.position.set(0, 0, 0); scene.add(sunLight); scene.add(sunLight.target);

// 地球（アプリの昼の地図）
const earth = new THREE.Group(); earth.position.copy(earthPos); scene.add(earth);
const RE = 0.6;
const loadTex = (src) => new Promise((res) => { const im = new Image(); im.onload = () => { const t = new THREE.CanvasTexture(im); t.encoding = THREE.sRGBEncoding; res(t); }; im.src = src; });
const earthMat = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0 });
const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(RE, 96, 64), earthMat); earth.add(earthMesh);
const atm = glow(0x6fb6ff, 1.75, earthPos); atm.uniforms.uA.value = 0.45;
// 緯度・経度 → 地球の表面（SphereGeometry の貼り方に合わせる）
const ll = (lat, lon, r = RE) => { const la = ((lat) * Math.PI / 180), ph = ((lon + 180) * Math.PI / 180); return V(-r * Math.cos(ph) * Math.cos(la), r * Math.sin(la), r * Math.sin(ph) * Math.cos(la)); };
// 日本を、太陽と反対ではなく、少し昼側の外向きに向ける
const outward = earthPos.clone().normalize();
const sideways = V(-outward.z, 0, outward.x); // 公転の向き
const faceDir = outward.clone().multiplyScalar(0.55).add(sideways.clone().multiplyScalar(0.8)).add(V(0, 0.25, 0)).normalize();
const pinLocal = ll(30.40, 130.98);
earth.quaternion.setFromUnitVectors(pinLocal.clone().normalize(), faceDir);
earth.rotateOnAxis(pinLocal.clone().normalize(), 0.3);
earth.updateMatrixWorld(true);
const pinWorld = earth.localToWorld(pinLocal.clone());

// 火星（模式の色）とフォボス
const mars = new THREE.Group(); mars.position.copy(marsPos); scene.add(mars);
const RM = 0.42;
const marsTex = (() => {
  const c = document.createElement("canvas"); c.width = 512; c.height = 256; const x = c.getContext("2d");
  x.fillStyle = "#b5562f"; x.fillRect(0, 0, 512, 256);
  let seed = 11; const rnd = () => ((seed = (1664525 * seed + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(${rnd() < .5 ? "70,30,20" : "220,140,90"},${.05 + rnd() * .12})`; x.beginPath(); x.ellipse(rnd() * 512, rnd() * 256, 4 + rnd() * 40, 2 + rnd() * 14, rnd() * 3, 0, 7); x.fill(); }
  x.fillStyle = "rgba(240,235,230,.8)"; x.fillRect(0, 0, 512, 10); x.fillRect(0, 248, 512, 8);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
})();
mars.add(new THREE.Mesh(new THREE.SphereGeometry(RM, 64, 48), new THREE.MeshStandardMaterial({ map: marsTex, roughness: 0.95 })));
const mAtm = glow(0xff9a6b, 1.15, marsPos); mAtm.uniforms.uA.value = 0.3;
const phobosR = RM * 9376 / 3390, phobosAng = 2.2;
const phobosPos = marsPos.clone().add(V(Math.cos(phobosAng) * phobosR, 0.04, -Math.sin(phobosAng) * phobosR));
const phobos = (() => {
  const g = new THREE.DodecahedronGeometry(0.075, 2); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const v = V(p.getX(i), p.getY(i), p.getZ(i)); const k = 1 + 0.18 * Math.sin(v.x * 40) * Math.cos(v.y * 33) + 0.1 * Math.sin(v.z * 51); v.multiply(V(1.25, 0.9, 1)).multiplyScalar(k); p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x8a8378, roughness: 1 })); m.position.copy(phobosPos); scene.add(m); return m;
})();
const phobosOrbit = (() => {
  const n = 160, p = [];
  for (let i = 0; i < n; i++) { const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2; p.push(...marsPos.clone().add(V(Math.cos(a0) * phobosR, 0, -Math.sin(a0) * phobosR)).toArray(), ...marsPos.clone().add(V(Math.cos(a1) * phobosR, 0, -Math.sin(a1) * phobosR)).toArray()); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uA: { value: 0.0 } },
    vertexShader: `void main(){ gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float uA; void main(){ gl_FragColor = vec4(.66,.6,.55,uA); }` });
  scene.add(new THREE.LineSegments(g, m)); return m;
})();
const phobosGlow = glow(0xffb547, 0.4, phobosPos); phobosGlow.uniforms.uA.value = 0;

// ---------- 航路 ----------
// ① 種子島から東へ上がり、地球のまわりを回る（打上げ計画書：1回目の燃焼 → 約53分の慣性飛行 → 2回目の燃焼 → 約1時間11分後に分離。地球のそばは大きさを誇張）
// ② 太陽のまわりを約220度回って火星へ（1年弱）③ 火星を回る軌道に入り、段階的にフォボスへ（形は簡略化）④ フォボスのまわり（擬周回軌道 QSO のイメージ）
const bez = (p0, p1, p2, p3, t) => { const u = 1 - t; return p0.clone().multiplyScalar(u * u * u).add(p1.clone().multiplyScalar(3 * u * u * t)).add(p2.clone().multiplyScalar(3 * u * t * t)).add(p3.clone().multiplyScalar(t * t * t)); };
const path = [];
const nW = pinWorld.clone().sub(earthPos).normalize();
const northW = earth.localToWorld(V(0, RE, 0)).sub(earthPos).normalize();
const eastW = northW.clone().cross(nW).normalize().negate();
const axis = nW.clone().cross(eastW).normalize();
const ROT = 1.55 * Math.PI; // 地球のまわりの角度（約1時間11分ぶん。誇張なし）
for (let i = 0; i <= 260; i++) {
  const t = i / 260, ang = t * ROT;
  const alt = RE * (1.0 + 0.32 * Math.min(1, t * 6) + 0.25 * Math.max(0, t - 0.8) / 0.2);
  path.push(earthPos.clone().add(nW.clone().applyAxisAngle(axis, ang).multiplyScalar(alt)));
}
const sepPt = path[path.length - 1].clone();
const sepDir = path[path.length - 1].clone().sub(path[path.length - 2]).normalize();
const tr = RT.transfer.map(P);
let k0 = tr.findIndex((p) => p.distanceTo(earthPos) > 2.2);
const join = tr[k0], joinDir = tr[k0 + 1].clone().sub(tr[k0]).normalize();
for (let i = 1; i <= 160; i++) path.push(bez(sepPt, sepPt.clone().add(sepDir.clone().multiplyScalar(0.9)), join.clone().sub(joinDir.clone().multiplyScalar(0.9)), join, i / 160));
const sStartArcIdx = path.length;
let k1 = tr.length - 1; while (tr[k1].distanceTo(marsPos) < 2.6) k1--;
for (let k = k0 + 1; k <= k1; k++) {
  const a = tr[k - 1], b = tr[k];
  for (let j = 1; j <= 6; j++) path.push(a.clone().lerp(b, j / 6));
}
const end = path[path.length - 1].clone(), endDir = end.clone().sub(path[path.length - 7]).normalize();
// 火星のそば：大きな楕円で1周 → 少し小さく → フォボスの軌道の高さへ
const mUp = V(0, 1, 0), mx = endDir.clone().cross(mUp).normalize(), mz = mUp.clone().cross(mx).normalize();
const ell = (a, b, th, cx = 0) => marsPos.clone().add(mx.clone().multiplyScalar(Math.cos(th) * a + cx)).add(mz.clone().multiplyScalar(Math.sin(th) * b));
const capStart = ell(2.0, 1.1, -0.35, 1.3);
for (let i = 1; i <= 160; i++) path.push(bez(end, end.clone().add(endDir.clone().multiplyScalar(0.8)), capStart.clone().add(V(0, 0, 0)).sub(mz.clone().multiplyScalar(-0.5)), capStart, i / 160));
for (let i = 1; i <= 300; i++) { const t = i / 300, th = -0.35 + t * Math.PI * 2; path.push(ell(lerp(2.0, 1.45, t), lerp(1.1, 1.0, t), th, lerp(1.3, 0.55, t))); }
for (let i = 1; i <= 220; i++) { const t = i / 220, th = -0.35 + t * Math.PI * 1.6; path.push(ell(lerp(1.45, phobosR, t), lerp(1.0, phobosR, t), th, lerp(0.55, 0, t))); }
// フォボスの位置を、この到着点のすこし先に置き直す
const arriveTh = -0.35 + Math.PI * 1.6 + 0.35;
phobosPos.copy(ell(phobosR, phobosR, arriveTh)); phobos.position.copy(phobosPos);
const qsoIn = path[path.length - 1].clone();
const toPh = phobosPos.clone().sub(qsoIn);
for (let i = 1; i <= 120; i++) path.push(bez(qsoIn, qsoIn.clone().add(toPh.clone().multiplyScalar(0.4)), phobosPos.clone().add(V(0.1, 0.0, 0.1)), phobosPos.clone().add(mx.clone().multiplyScalar(0.12)), i / 120));
const qa = phobosPos.clone().add(mx.clone().multiplyScalar(0.12));
for (let i = 1; i <= 200; i++) { const an = i / 200 * Math.PI * 2; const tng = phobosPos.clone().sub(marsPos).normalize(), rad = tng.clone().cross(mUp).normalize();
  path.push(phobosPos.clone().add(rad.clone().multiplyScalar(Math.cos(an) * -0.12)).add(tng.clone().multiplyScalar(Math.sin(an) * 0.22)).add(mx.clone().multiplyScalar(0))); }
const start = join;
billboards.find((b) => b.material === phobosGlow).position.copy(phobosPos);

// 弧の長さで、点を等間隔に並べ直す
const cum = [0]; for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + path[i].distanceTo(path[i - 1]));
const L = cum[cum.length - 1];
const at = (s) => { const d = s * L; let lo = 0, hi = cum.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] < d) lo = m; else hi = m; } const t = (d - cum[lo]) / Math.max(1e-9, cum[hi] - cum[lo]); return path[lo].clone().lerp(path[hi], t); };
const sOf = (target) => { let best = 0, bd = 1e9; for (let i = 0; i < path.length; i++) { const d = path[i].distanceToSquared(target); if (d < bd) { bd = d; best = i; } } return cum[best] / L; };
const sEndArc = sOf(end), sQso = sOf(qsoIn), sCap = sOf(capStart);
// 地球のそばは細かく、遠くは粗く（どこでも点線に見えるように）
const dots = [], ss = [];
for (let d = 0; d < L; ) { const s = d / L; const p = at(s); dots.push(...p.toArray()); ss.push(s); const nearE = p.distanceTo(earthPos), nearP = p.distanceTo(phobosPos); d += Math.min(0.12, 0.012 + 0.05 * Math.min(nearE * 0.6, nearP * 1.2, p.distanceTo(marsPos) * 0.8)); }
const dg = new THREE.BufferGeometry();
dg.setAttribute("position", new THREE.Float32BufferAttribute(dots, 3));
dg.setAttribute("aS", new THREE.Float32BufferAttribute(ss, 1));
const route = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uReveal: { value: 0 }, uMMX: { value: 0.16 }, uFront: { value: 0.16 }, uTime: { value: 0 }, uPx: { value: devicePixelRatio } },
  vertexShader: `
    attribute float aS; uniform float uReveal, uMMX, uFront, uTime, uPx; varying vec3 vC; varying float vA;
    void main(){
      vec4 mv = modelViewMatrix*vec4(position,1.);
      float past = step(aS, uMMX) * step(aS, uReveal);           // 通ってきた道
      float ahead = step(uMMX, aS);                                // これから
      float lit = ahead * step(aS, uFront);                        // 光が届いたところ
      float head = ahead * exp(-pow((uFront - aS) * 90., 2.));     // 光の先端
      vec3 mint = vec3(.37,.95,.76), amber = vec3(1.,.71,.28);
      vC = mint * past + mix(vec3(.55,.68,.8), mint, lit) * ahead * (1. - head) + amber * head;
      vA = past * .95 + ahead * (.2 + .65 * lit + .9 * head);
      float sz = (past > .5 ? 2.2 : 1.7) + head * 4.;
      gl_PointSize = clamp(sz * uPx * 18. / -mv.z, 1.7 * uPx, 9. * uPx);
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: `varying vec3 vC; varying float vA; void main(){ float d = length(gl_PointCoord-.5)*2.; gl_FragColor = vec4(vC, vA * smoothstep(1.,.35,d)); }`,
});
scene.add(new THREE.Points(dg, route));
{
  // 光の筋：通ってきた道と、光が届いたところを一本の明るい線に（先端ほど琥珀色に）
  const N = 4000, lp = [], ls = [];
  for (let i = 0; i < N; i++) { lp.push(...at(i / N).toArray(), ...at((i + 1) / N).toArray()); ls.push(i / N, (i + 1) / N); }
  const lg = new THREE.BufferGeometry(); lg.setAttribute("position", new THREE.Float32BufferAttribute(lp, 3)); lg.setAttribute("aS", new THREE.Float32BufferAttribute(ls, 1));
  for (const w of [0, 1, 2]) {
    const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: route.uniforms,
      vertexShader: `attribute float aS; uniform float uReveal, uMMX, uFront; varying float vLit, vHead, vPast; void main(){
        vPast = step(aS, uMMX) * step(aS, uReveal); vLit = step(uMMX, aS) * step(aS, uFront); vHead = vLit * exp(-(uFront - aS) * 40.);
        vec3 p = position + vec3(0., ${(w * 0.012).toFixed(3)}, 0.);
        gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.); }`,
      fragmentShader: `varying float vLit, vHead, vPast; void main(){ vec3 c = mix(vec3(.37,.95,.76), vec3(1.,.74,.32), vHead); gl_FragColor = vec4(c, .12 + .55 * vPast + (.75 * vLit + .4 * vHead) ${w ? "* .5" : ""}); }` });
    scene.add(new THREE.LineSegments(lg, m));
  }
}

// 種子島のピン（光る輪）
const pinGlow = glow(0x5ef2c2, 0.12, pinWorld);
const pinRing = ringGlow(0x5ef2c2, pinWorld); pinGlow.depthTest = false; pinRing.depthTest = false;

// ---------- MMX（アプリの模型） ----------
const sMMX = sOf(tr[Math.max(k0 + 4, 25)]); // およそ現在（試作では打ち上げ50日後あたり）
const mmx = MODELS.mmx(THREE, makeKit(THREE));
const mmxHolder = new THREE.Group(); mmxHolder.add(mmx); scene.add(mmxHolder);
const mmxPos = at(sMMX), mmxDir = at(sMMX + 0.002).sub(mmxPos).normalize();
mmxHolder.position.copy(mmxPos);
mmxHolder.scale.setScalar(0.22);
mmxHolder.lookAt(mmxPos.clone().add(mmxDir));
mmx.rotation.set(0.3, 0.6, 0.15);
const mmxGlow = glow(0x5ef2c2, 0.7, mmxPos); mmxGlow.uniforms.uA.value = 0.0;
route.uniforms.uMMX.value = sMMX;

// ---------- カメラの流れ（12秒） ----------
const camAt = {
  near: { pos: pinWorld.clone().add(faceDir.clone().multiplyScalar(2.8)).add(sideways.clone().multiplyScalar(-0.9)).add(V(0, 0.3, 0)), look: pinWorld.clone().lerp(earthPos, 0.6).add(V(0, -0.45, 0)).add(sideways.clone().multiplyScalar(0.25)) },
  mid: { pos: mmxPos.clone().add(mmxDir.clone().cross(V(0, 1, 0)).normalize().multiplyScalar(1.5)).add(V(0, 0.55, 0)).add(mmxDir.clone().multiplyScalar(0.5)), look: mmxPos.clone().add(mmxDir.clone().multiplyScalar(-0.25)).add(V(0, -0.35, 0)) },
  wide: { pos: V(0, 56, 0).add(earthPos.clone().lerp(marsPos, 0.5).multiplyScalar(-0.2)).add(V(0, 0, 16)), look: earthPos.clone().lerp(marsPos, 0.5).multiplyScalar(-0.2).add(V(0, 0, 2)) },
  mars: { pos: marsPos.clone().add(V(0, 3.0, 0)).add(mz.clone().multiplyScalar(-3.2)).add(mx.clone().multiplyScalar(1.2)), look: marsPos.clone().lerp(phobosPos, 0.3) },
};
const mixCam = (A, B, t) => ({ pos: A.pos.clone().lerp(B.pos, t), look: A.look.clone().lerp(B.look, t) });
const caps = [
  [0, "2026.10.20 4:41", "種子島から"],
  [1.7, "+1時間11分", "地球を回って、火星へ向かう軌道へ"],
  [3.4, "NOW（イメージ）", "MMX は、いまこのあたり"],
  [5.6, "1年弱", "太陽のまわりを大きく回って、火星へ"],
  [10.0, "2027年度", "火星を回る軌道へ。そしてフォボスへ"],
];
const tags = { tane: document.getElementById("tag-tane"), mmx: document.getElementById("tag-mmx"), mars: document.getElementById("tag-mars"), phobos: document.getElementById("tag-phobos") };
const place = (el, p, alpha, dy = -14) => { const v = p.clone().project(camera); const vis = v.z < 1 && alpha > 0.01; el.style.opacity = vis ? alpha : 0; el.style.left = `${(v.x + 1) / 2 * W}px`; el.style.top = `${(1 - v.y) / 2 * H + dy}px`; };

function renderAt(t) {
  // カメラ：地球 → MMX → 光の筋の先端を追う（ワープ）→ 火星を回る軌道を見る
  const fTo = (x) => Math.min(1, Math.max(0, x));
  const front = t < 5.2 ? sMMX : t < 9.8 ? lerp(sMMX, sCap, fTo((t - 5.2) / 4.6) ** 1.15) : lerp(sCap, 1, smooth(9.8, 12.6, t));
  const chase = () => {
    const f = Math.min(front, sCap), head = at(f), back = at(Math.max(0, f - 0.006));
    const dir = head.clone().sub(back).normalize(), side = dir.clone().cross(V(0, 1, 0)).normalize();
    const back2 = at(Math.max(0, f - 0.016)); return { pos: back2.clone().add(V(0, 0.42, 0)).add(side.multiplyScalar(0.1)), look: at(Math.min(1, f + 0.02)).add(V(0, -0.06, 0)) };
  };
  let c;
  if (t < 2.6) c = camAt.near;
  else if (t < 4.4) c = mixCam(camAt.near, camAt.mid, smooth(2.6, 4.4, t));
  else if (t < 5.2) c = camAt.mid;
  else if (t < 9.4) c = mixCam(camAt.mid, chase(), smooth(5.2, 6.0, t));
  else c = mixCam(chase(), camAt.mars, smooth(9.4, 10.9, t));
  const warp = smooth(5.7, 6.6, t) * (1 - smooth(8.8, 9.8, t));
  camera.fov = 42 + 22 * warp; camera.updateProjectionMatrix();
  const drift = V(Math.sin(t * 0.3) * 0.05, 0, Math.cos(t * 0.27) * 0.05).add(V(Math.sin(t * 37) * 0.012, Math.cos(t * 41) * 0.012, 0).multiplyScalar(warp));
  camera.position.copy(c.pos).add(drift); camera.lookAt(c.look);
  document.getElementById("vig").style.opacity = warp * 0.9;
  const fwd = c.look.clone().sub(c.pos).normalize();
  streak.uniforms.uDir.value.copy(fwd).multiplyScalar(-1); streak.uniforms.uLen.value = warp * 14; streak.uniforms.uA.value = warp * 0.55; streak.uniforms.uC.value.copy(camera.position);
  // 道
  route.uniforms.uReveal.value = lerp(0, sMMX, smooth(0.6, 4.2, t));
  route.uniforms.uFront.value = front;
  // ピンの輪（3.6秒ごと）
  const ph = (t % 1.8) / 1.8; pinRing.uniforms.uS.value = 0.06 + ph * 0.32; pinRing.uniforms.uA.value = (1 - ph) * 0.9 * (1 - smooth(4, 6, t) * 0.6);
  pinGlow.uniforms.uA.value = 0.9;
  // MMX
  mmxHolder.visible = t > 3.0;
  mmx.rotation.y = 0.6 + t * 0.25;
  sunLight.target.position.copy(mmxPos);
  mmxGlow.uniforms.uA.value = smooth(3.2, 4.2, t) * (0.55 + 0.25 * Math.sin(t * 3.5));
  // フォボス
  const arrive = smooth(12.2, 12.8, t);
  phobosOrbit.uniforms.uA.value = 0.12 + 0.25 * smooth(10.5, 12.2, t);
  phobosGlow.uniforms.uA.value = arrive * (0.7 + 0.3 * Math.sin(t * 4)); phobosGlow.uniforms.uS.value = 0.25 + arrive * 0.35;
  earthMesh.rotation.y = t * 0.03;
  for (const b of billboards) { b.quaternion.copy(camera.quaternion); b.scale.setScalar(b.material.uniforms.uS.value); }
  renderer.render(scene, camera);
  // 文字
  const cap = [...caps].reverse().find((x) => t >= x[0]);
  document.getElementById("capk").textContent = cap[1]; document.getElementById("capt").textContent = cap[2];
  const capFade = Math.min(smooth(cap[0], cap[0] + 0.5, t), 1);
  document.querySelector(".cap").style.opacity = capFade;
  place(tags.tane, pinWorld, 1 - smooth(3.0, 4.0, t));
  place(tags.mmx, mmxPos, smooth(3.6, 4.4, t) * (1 - smooth(5.2, 5.8, t)), -100);
  place(tags.mars, marsPos.clone().add(V(0, -RM, 0)), smooth(10.2, 10.9, t), 34);
  place(tags.phobos, phobosPos, smooth(12.2, 12.7, t), -18);
}
window.renderAt = renderAt;
window.ready = loadTex("../../web/assets/earth/day-2048.jpg").then((tex) => { earthMat.map = tex; earthMat.needsUpdate = true; return document.fonts.ready; }).then(() => { renderAt(0); return true; });
if (!navigator.webdriver) { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % 14); requestAnimationFrame(loop); }; window.ready.then(loop); }
