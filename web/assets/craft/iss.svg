<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" fill="none" stroke="#ffb547" stroke-width="1.2" stroke-linejoin="round">
  <!-- 国際宇宙ステーションの簡略化した線画（形の雰囲気を示すもので、正確な図面ではない） -->
  <defs>
    <pattern id="cells" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M6 0H0V6" stroke="#ffb547" stroke-width=".5" opacity=".6"/>
    </pattern>
    <g id="wing">
      <rect x="0" y="0" width="22" height="52" fill="url(#cells)"/>
      <rect x="26" y="0" width="22" height="52" fill="url(#cells)"/>
      <path d="M24 0V52"/>
    </g>
  </defs>
  <!-- トラス（横に長い骨組み） -->
  <path d="M40 72H320M40 78H320"/>
  <path d="M40 72L52 78L64 72L76 78L88 72L100 78L112 72L124 78L136 72L148 78L160 72M200 72L212 78L224 72L236 78L248 72L260 78L272 72L284 78L296 72L308 78L320 72" stroke-width=".6"/>
  <!-- 太陽電池パドル（左右に2組ずつ） -->
  <use href="#wing" x="18" y="14"/>
  <use href="#wing" x="18" y="84"/>
  <use href="#wing" x="70" y="14"/>
  <use href="#wing" x="70" y="84"/>
  <use href="#wing" x="242" y="14"/>
  <use href="#wing" x="242" y="84"/>
  <use href="#wing" x="294" y="14"/>
  <use href="#wing" x="294" y="84"/>
  <path d="M42 66V72M94 66V72M266 66V72M318 66V72M42 78V84M94 78V84M266 78V84M318 78V84"/>
  <!-- ラジエーター -->
  <path d="M140 78V96H156V78M204 78V96H220V78" stroke-width=".8"/>
  <!-- 与圧モジュール（中央の縦の並び） -->
  <rect x="172" y="30" width="16" height="24" rx="3"/>
  <rect x="170" y="54" width="20" height="40" rx="4"/>
  <rect x="173" y="94" width="14" height="30" rx="3"/>
  <rect x="150" y="60" width="20" height="10" rx="3"/>
  <rect x="190" y="60" width="22" height="10" rx="3"/>
  <rect x="190" y="84" width="18" height="9" rx="3"/>
  <path d="M180 124V134M174 134H186" stroke-width=".8"/>
  <circle cx="180" cy="26" r="3"/>
</svg>
