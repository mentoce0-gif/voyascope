<body>
<div class="warp-vignette" id="vig"></div>
<div class="hud">
  <div class="top">
    <a class="btn" href="../../" aria-label="地球の画面へ戻る">‹ 地球へ</a>

  <div class="note" title="地球と火星の位置は計算。到着日は仮（打ち上げ330日後。公式は「往路1年弱」「火星圏到着 2027年度」）。地球のそばの道と火星のまわりは簡略化。大きさは実際の比ではありません。打ち上げのあとの位置は、公式の発表で打ち上げを確かめてから、計画の軌道の上を日数で進めた「およその位置」です">模式図（地球・火星の位置は計算、到着日は仮、大きさは実際の比ではない）。打ち上げ後の位置は、公式で確かめてから計画の軌道で出す。出典：<a href="https://www.jaxa.jp/press/2026/10/files/jaxa20261018-1_01.pdf" target="_blank" rel="noopener">JAXA 打上げ計画書</a>・<a href="https://fanfun.jaxa.jp/countdown/mmx_h3f10/files/mmx_press-kit_ja_20260918.pdf" target="_blank" rel="noopener">MMX プレスキット</a>。非公式のファンメイド作品</div>

<script type="module">
import * as THREE from "../../vendor/three-r128.min.js";
import { makeKit, MODELS } from "../../js/far/models.js";
import { mmxPhase, transferProgress, untilText } from "./state.js";

let W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: !!navigator.webdriver });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050e1f);
const camera = new THREE.PerspectiveCamera(42, W / H, 0.01, 500);

const MINT = new THREE.Color(0x5ef2c2), AMBER = new THREE.Color(0xffb547);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- 星空（模擬：明るさ・色のちがう星と、天の川の帯。実在の星の位置ではない） ----------
const sky = new THREE.Group(); scene.add(sky);
{
  let seed = 7; const rnd = () => ((seed = (1664525 * seed + 1013904223) >>> 0) / 4294967296);
  const bandN = V(0.62, 0.2, 0.76).normalize(); // 天の川の帯の向き（見た目のため）
  const n = 9000, p = new Float32Array(n * 3), sz = new Float32Array(n), col = new Float32Array(n * 3);
  const palette = [[0.75, 0.85, 1.0], [0.92, 0.95, 1.0], [1.0, 1.0, 0.98], [1.0, 0.93, 0.8], [1.0, 0.82, 0.62]];
  for (let i = 0; i < n; i++) {
    let v;
    if (i < n * 0.45) { // 天の川の帯に寄せる
      const a = V(rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1).normalize();
      const off = (rnd() + rnd() + rnd() - 1.5) * 0.18;
      v = a.sub(bandN.clone().multiplyScalar(a.dot(bandN))).normalize().add(bandN.clone().multiplyScalar(off)).normalize();
    } else { const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2; v = V(Math.sqrt(1 - u * u) * Math.cos(th), u, Math.sqrt(1 - u * u) * Math.sin(th)); }
    p.set(v.multiplyScalar(150).toArray(), i * 3);
    const m = Math.pow(rnd(), 6); // 明るい星は少なく
    sz[i] = 1.0 + m * 3.6;
    const c = palette[Math.floor(rnd() * palette.length)]; col.set(c, i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(p, 3)); g.setAttribute("aSize", new THREE.BufferAttribute(sz, 1)); g.setAttribute("aCol", new THREE.BufferAttribute(col, 3));
  sky.add(new THREE.Points(g, new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uPx: { value: devicePixelRatio } },
    vertexShader: `attribute float aSize; attribute vec3 aCol; uniform float uPx; varying vec3 vC; varying float vB; void main(){ vC = aCol; vB = clamp(aSize / 2.2, .25, 1.); gl_PointSize = aSize * uPx; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `varying vec3 vC; varying float vB; void main(){ float d = length(gl_PointCoord-.5)*2.; gl_FragColor = vec4(vC, smoothstep(1.,.0,d) * (.5 + .5 * vB)); }` })));
  // 天の川のぼんやりした光（雲のようなむら）
  sky.add(new THREE.Mesh(new THREE.SphereGeometry(155, 48, 32), new THREE.ShaderMaterial({ side: THREE.BackSide, transparent: true, depthWrite: false, uniforms: { uN: { value: bandN } },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uN; varying vec3 vP;
      float h(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      float nz(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.-2.*f);
        return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }
      void main(){ float b = exp(-pow(dot(vP, uN) * 3.6, 2.)); float m = nz(vP * 6.) * .6 + nz(vP * 14.) * .4; float dust = smoothstep(.55, .75, nz(vP * 9. + 3.));
        vec3 c = mix(vec3(.23,.27,.45), vec3(.55,.48,.42), m); gl_FragColor = vec4(c, b * (.16 + .22 * m) * (1. - .7 * dust * b)); }` })));
}

// ワープの星の筋（遠くを見る部屋と同じ考え方：速いほど星が後ろへ流れる）
const streak = (() => {
  const n = 900, p = [], e = [];
  let seed = 21; const rnd = () => ((seed = (1664525 * seed + 1013904223) >>> 0) / 4294967296);
  // 1本の筋を 8 つの短い線でつなぐ（曲がるときに弧にするため）
  const K = 8;
  for (let i = 0; i < n; i++) { const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = 30 + rnd() * 60; const q = [r * Math.sqrt(1 - u * u) * Math.cos(th), r * u, r * Math.sqrt(1 - u * u) * Math.sin(th)]; for (let k = 0; k < K; k++) { p.push(...q, ...q); e.push(k / K, (k + 1) / K); } }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3)); g.setAttribute("aEnd", new THREE.Float32BufferAttribute(e, 1));
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uDir: { value: V(0, 0, 1) }, uLen: { value: 0 }, uA: { value: 0 }, uC: { value: V(0, 0, 0) }, uBend: { value: V(0, 0, 0) } },
    vertexShader: `attribute float aEnd; uniform vec3 uDir, uC, uBend; uniform float uLen; varying float vE; void main(){ vE = aEnd; vec3 p = position + uC + uDir * uLen * aEnd + uBend * uLen * aEnd * aEnd; gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.); }`,
    fragmentShader: `uniform float uA; varying float vE; void main(){ gl_FragColor = vec4(.85,.93,1., uA * (1. - vE)); }` });
  scene.add(new THREE.LineSegments(g, m)); return m;
})();

// ---------- 太陽系（模式。大きさ・距離は実際の比ではない） ----------
// 打ち上げ日の地球と、約1年弱後（仮に330日後）の火星の位置（astronomy-engine）と、その2点を結ぶ軌道（ランベルトの解）。
// 計算は scratchpad の route.mjs。1 AU = 10。黄道面を水平に
const [RT, EVENTS] = await Promise.all([fetch("route.json").then((r) => r.json()), fetch("../../data/events.json", { cache: "no-cache" }).then((r) => r.json())]);
const EV = EVENTS.events.find((e) => e.id === "mmx-launch");
const NOW = new Date();
const PH = EV ? mmxPhase(EV, NOW) : { phase: "before", launchAt: Date.parse(RT.launch) };
const FLYING = PH.phase === "flying";
const AU = 10, P = (v) => V(v[0] * AU, v[2] * AU, -v[1] * AU);
const earthPos = P(RT.earth), marsPos = P(RT.mars);

// 太陽
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.9, 48, 32), new THREE.MeshStandardMaterial({ color: 0xffe2a8, emissive: 0xffc96b, emissiveIntensity: 2.2 }));
scene.add(sun);
const billboards = [];
const board = (frag, color, size, pos) => {
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uC: { value: new THREE.Color(color) }, uS: { value: size }, uA: { value: 1 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: frag });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), m); mesh.position.copy(pos); scene.add(mesh); billboards.push(mesh);
  return m;
};
const glow = (color, size, pos) => board(`uniform vec3 uC; uniform float uA; varying vec2 vUv; void main(){ float d=length(vUv-.5)*2.; gl_FragColor=vec4(uC, pow(max(0.,1.-d),2.4)*uA); }`, color, size, pos);
const ringGlow = (color, pos) => board(`uniform vec3 uC; uniform float uA; varying vec2 vUv; void main(){ float d=length(vUv-.5)*2.; gl_FragColor=vec4(uC, smoothstep(.72,.88,d)*smoothstep(1.,.9,d)*uA); }`, color, 0.2, pos);
glow(0xffb547, 9, V(0, 0, 0)); glow(0xfff3d6, 3.2, V(0, 0, 0));

// 公転の線
const ring = (r, color, a) => {
  const n = 256, p = [];
  for (let i = 0; i < n; i++) { const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2; p.push(...onOrbit(r, a0).toArray(), ...onOrbit(r, a1).toArray()); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uC: { value: new THREE.Color(color) }, uA: { value: a } },
    vertexShader: `void main(){ gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uC; uniform float uA; void main(){ gl_FragColor = vec4(uC,uA); }` });
  scene.add(new THREE.LineSegments(g, m));
};
const orbitLine = (pts, color, a) => {
  const p = []; for (let i = 0; i < pts.length - 1; i++) p.push(...P(pts[i]).toArray(), ...P(pts[i + 1]).toArray());
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.LineSegments(g, new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uC: { value: new THREE.Color(color) }, uA: { value: a } },
    vertexShader: `void main(){ gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uC; uniform float uA; void main(){ gl_FragColor = vec4(uC,uA); }` })));
};
orbitLine(RT.earthOrbit, 0x5b8fd6, 0.3);
orbitLine(RT.marsOrbit, 0xd98a5b, 0.3);

// 光
// 宇宙の光：太陽からの強い主光（影をつくる）・弱く冷たい環境光・輪郭を浮かせる後ろからの青白い光
scene.add(new THREE.AmbientLight(0x6d86b8, 0.12));
scene.add(new THREE.HemisphereLight(0x9fb6e0, 0x1a1410, 0.18));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const sunLight = new THREE.DirectionalLight(0xfff1dc, 3.0); sunLight.position.set(0, 0, 0); scene.add(sunLight); scene.add(sunLight.target);
const rimLight = new THREE.DirectionalLight(0x9cc2ff, 0.9); scene.add(rimLight); scene.add(rimLight.target);

// 地球（アプリの昼の地図）
const earth = new THREE.Group(); earth.position.copy(earthPos); scene.add(earth);
const RE = 0.6;
const loadTex = (src) => new Promise((res) => { const im = new Image(); im.onload = () => { const t = new THREE.CanvasTexture(im); t.encoding = THREE.sRGBEncoding; res(t); }; im.src = src; });
const earthMat = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0 });
const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(RE, 96, 64), earthMat); earth.add(earthMesh);
const atm = glow(0x6fb6ff, 1.75, earthPos); atm.uniforms.uA.value = 0.45;
// 緯度・経度 → 地球の表面（SphereGeometry の貼り方に合わせる）
const ll = (lat, lon, r = RE) => { const la = ((lat) * Math.PI / 180), ph = ((lon + 180) * Math.PI / 180); return V(-r * Math.cos(ph) * Math.cos(la), r * Math.sin(la), r * Math.sin(ph) * Math.cos(la)); };
// 日本を、太陽と反対ではなく、少し昼側の外向きに向ける
const outward = earthPos.clone().normalize();
const sideways = V(-outward.z, 0, outward.x); // 公転の向き
const faceDir = outward.clone().multiplyScalar(0.55).add(sideways.clone().multiplyScalar(0.8)).add(V(0, 0.25, 0)).normalize();
const pinLocal = ll(30.40, 130.98);
earth.quaternion.setFromUnitVectors(pinLocal.clone().normalize(), faceDir);
earth.rotateOnAxis(pinLocal.clone().normalize(), 0.3);
earth.updateMatrixWorld(true);
const pinWorld = earth.localToWorld(pinLocal.clone());

// 火星（模式の色）とフォボス
const mars = new THREE.Group(); mars.position.copy(marsPos); scene.add(mars);
const RM = 0.42;
const marsTex = (() => {
  const c = document.createElement("canvas"); c.width = 512; c.height = 256; const x = c.getContext("2d");
  x.fillStyle = "#b5562f"; x.fillRect(0, 0, 512, 256);
  let seed = 11; const rnd = () => ((seed = (1664525 * seed + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(${rnd() < .5 ? "70,30,20" : "220,140,90"},${.05 + rnd() * .12})`; x.beginPath(); x.ellipse(rnd() * 512, rnd() * 256, 4 + rnd() * 40, 2 + rnd() * 14, rnd() * 3, 0, 7); x.fill(); }
  x.fillStyle = "rgba(240,235,230,.8)"; x.fillRect(0, 0, 512, 10); x.fillRect(0, 248, 512, 8);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
})();
mars.add(new THREE.Mesh(new THREE.SphereGeometry(RM, 64, 48), new THREE.MeshStandardMaterial({ map: marsTex, roughness: 0.95 })));
const mAtm = glow(0xff9a6b, 1.15, marsPos); mAtm.uniforms.uA.value = 0.3;
const phobosR = RM * 9376 / 3390, phobosAng = 2.2;
const phobosPos = marsPos.clone().add(V(Math.cos(phobosAng) * phobosR, 0.04, -Math.sin(phobosAng) * phobosR));
const phobos = (() => {
  const g = new THREE.DodecahedronGeometry(0.075, 2); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const v = V(p.getX(i), p.getY(i), p.getZ(i)); const k = 1 + 0.18 * Math.sin(v.x * 40) * Math.cos(v.y * 33) + 0.1 * Math.sin(v.z * 51); v.multiply(V(1.25, 0.9, 1)).multiplyScalar(k); p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x8a8378, roughness: 1 })); m.position.copy(phobosPos); scene.add(m); return m;
})();
const phobosOrbit = (() => {
  const n = 160, p = [];
  for (let i = 0; i < n; i++) { const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2; p.push(...marsPos.clone().add(V(Math.cos(a0) * phobosR, 0, -Math.sin(a0) * phobosR)).toArray(), ...marsPos.clone().add(V(Math.cos(a1) * phobosR, 0, -Math.sin(a1) * phobosR)).toArray()); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uA: { value: 0.0 } },
    vertexShader: `void main(){ gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float uA; void main(){ gl_FragColor = vec4(.66,.6,.55,uA); }` });
  scene.add(new THREE.LineSegments(g, m)); return m;
})();
const phobosGlow = glow(0xffb547, 0.4, phobosPos); phobosGlow.uniforms.uA.value = 0;

// ---------- 航路 ----------
// ① 種子島から東へ上がり、地球のまわりを回る（打上げ計画書：1回目の燃焼 → 約53分の慣性飛行 → 2回目の燃焼 → 約1時間11分後に分離。地球のそばは大きさを誇張）
// ② 太陽のまわりを約220度回って火星へ（1年弱）③ 火星を回る軌道に入り、段階的にフォボスへ（形は簡略化）④ フォボスのまわり（擬周回軌道 QSO のイメージ）
const bez = (p0, p1, p2, p3, t) => { const u = 1 - t; return p0.clone().multiplyScalar(u * u * u).add(p1.clone().multiplyScalar(3 * u * u * t)).add(p2.clone().multiplyScalar(3 * u * t * t)).add(p3.clone().multiplyScalar(t * t * t)); };
const path = [];
const nW = pinWorld.clone().sub(earthPos).normalize();
const northW = earth.localToWorld(V(0, RE, 0)).sub(earthPos).normalize();
const eastW = northW.clone().cross(nW).normalize().negate();
const axis = nW.clone().cross(eastW).normalize();

const watchCenter = earthPos.clone().add(marsPos).multiplyScalar(0.12);
const R_FIT = 17;
const watchH = () => { const half = Math.tan((42 / 2) * Math.PI / 180) * Math.min(1, W / H); return R_FIT / half; };
const watchCam = { get pos() { return watchCenter.clone().add(V(0, watchH(), watchH() * 0.18)); }, get look() { return watchCenter.clone(); } };
function watchAt(t) {
  camera.fov = 42; camera.updateProjectionMatrix();
  camera.position.copy(watchCam.pos).add(V(Math.sin(t * 0.2) * 0.6, 0, Math.cos(t * 0.17) * 0.6)); camera.lookAt(watchCam.look);
  document.getElementById("vig").style.opacity = 0; streak.uniforms.uA.value = 0;
  route.uniforms.uReveal.value = sMMX; route.uniforms.uFront.value = sMMX;
  const PERIOD = 5, RUN = 3.2, ph = t % PERIOD;
  route.uniforms.uPulse.value = ph < RUN ? -0.05 + (ph / RUN) * 1.1 : -1;
  mmxHolder.visible = true; mmxHolder.scale.setScalar(FLYING ? 0.9 : 0.35); mmx.rotation.y = 0.6 + t * 0.25;
  // 光が MMX を通るとき、MMX の灯りが強まる
  const pass = Math.exp(-Math.pow((route.uniforms.uPulse.value - sMMX) * 30, 2));
  const up = route.uniforms.uPulse.value;
  if (up >= 0 && up <= 1) { billboards.find((b) => b.material === comet).position.copy(at(up)); comet.uniforms.uC.value.set(up < sMMX ? 0x9ff7d8 : 0xffc76b); comet.uniforms.uA.value = 0.95; comet.uniforms.uS.value = 1.6; } else comet.uniforms.uA.value = 0;
  mmxGlow.uniforms.uS.value = 2.4; mmxGlow.uniforms.uA.value = 0.55 + 0.45 * pass;
  pinRing.uniforms.uA.value = 0; pinGlow.uniforms.uA.value = 0.6;
  phobosOrbit.uniforms.uA.value = 0.2; phobosGlow.uniforms.uA.value = Math.exp(-Math.pow((route.uniforms.uPulse.value - 1) * 20, 2)); phobosGlow.uniforms.uS.value = 1.2;
  for (const b of billboards) { b.quaternion.copy(camera.quaternion); b.scale.setScalar(b.material.uniforms.uS.value); }
  sky.position.copy(camera.position);
  rimLight.target.position.copy(mmxPos); rimLight.position.copy(mmxPos).add(mmxPos.clone().sub(camera.position).normalize().add(V(0, 0.6, 0)).multiplyScalar(2));
  renderer.render(scene, camera);
  watchCaption();
  document.querySelector(".cap").style.opacity = 1;
  place(tags.tane, pinWorld, 0); place(tags.mmx, mmxPos, 1, -26); place(tags.mars, marsPos.clone().add(V(0, -RM, 0)), 1, 30); place(tags.phobos, phobosPos, 0);
}
window.watchAt = watchAt;
// 監視モードの文字：打ち上げ前・未確認・延期・飛行中
let capCache = "";
function watchCaption() {
  const now = Date.now();
  let k, t, sub = "";
  if (PH.phase === "flying") { k = "NOW（計画の軌道から計算・模式）"; t = "MMX は、いまこのあたり"; sub = `打ち上げから <b>${Math.floor(PH.days + (now - NOW.getTime()) / 86400000)}日</b>`; }
  else if (PH.phase === "postponed") { k = "延期"; t = "MMX は、種子島で待っています"; sub = "新しい日時は JAXA の発表で"; }
  else if (now >= PH.launchAt) { k = "打ち上げの予定の時刻を過ぎました"; t = "MMX は、まだ種子島に描いています"; sub = "打ち上げの結果は JAXA の発表で確かめてください。確かめたら、ここに旅の位置を出します"; }
  else { k = "打ち上げ前"; t = "MMX は、いま種子島に"; sub = `打ち上げまで <b>${untilText(PH.launchAt - now)}</b>（${launchJst}の予定）`; }
  const key = k + t + sub;
  if (key === capCache) return;
  capCache = key;
  document.getElementById("capk").textContent = k; document.getElementById("capt").textContent = t; document.getElementById("caps").innerHTML = sub;
}
window.ready = loadTex("../../assets/earth/day-2048.jpg").then((tex) => { earthMat.map = tex; earthMat.needsUpdate = true; return document.fonts.ready; }).then(() => { renderAt(0); return true; });
// はじめて開いたときはオープニング（16秒）→ 監視モード。2回目からは監視モードから（「はじめから」で見直せる）
const SEEN = "voyascope.mmx-now.seen";
const seen = (() => { try { return localStorage.getItem(SEEN) === "1"; } catch { return false; } })();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let t0 = performance.now(), opening = !(seen || reduce || location.hash === "#watch");
const skipBtn = document.getElementById("skip"), replayBtn = document.getElementById("replay");
const toWatch = () => { opening = false; t0 = performance.now(); skipBtn.hidden = true; replayBtn.hidden = false; try { localStorage.setItem(SEEN, "1"); } catch {} };
skipBtn.addEventListener("click", toWatch);
replayBtn.addEventListener("click", () => { opening = true; t0 = performance.now(); skipBtn.hidden = false; replayBtn.hidden = true; });
if (!opening) { skipBtn.hidden = true; replayBtn.hidden = false; }
addEventListener("resize", () => { W = innerWidth; H = innerHeight; renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix(); });
if (!navigator.webdriver) { const loop = () => { const t = (performance.now() - t0) / 1000; if (opening && t >= 16) toWatch(); opening ? renderAt(t) : watchAt(reduce ? 0 : t); requestAnimationFrame(loop); }; window.ready.then(loop); }
</script>
